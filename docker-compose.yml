# core 스택: 상시 실행하는 엣지 프록시(proxy)와 수집기(crawler), 데이터 볼륨, 공유 네트워크.
# 화면(web)·API(backend)는 docker-compose.app.yml로 색상별(news-blue / news-green) 프로젝트에서 실행하고,
# scripts/deploy.sh가 블루-그린 방식으로 교체한다. 배포·로컬 실행 모두 스크립트 사용을 권장한다(README 참고).
#
# 프로젝트 이름은 기존 볼륨(news-project_news-data)을 그대로 쓰기 위해 news-project로 유지한다.

name: news-project

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 블루-그린에서 제외한 단일 인스턴스. 두 개가 동시에 돌면 01:00 수집이 중복되고
  # Gemini 할당량을 두 배로 쓰므로, 교체 여부는 호스트 공유 flock과 수집 시간대를 보고 결정한다.
  crawler:
    build: ./news-crawling
    image: ${CRAWLER_IMAGE:-news-crawler:latest}
    env_file:
      - path: ./news-crawling/.env
        required: false
    environment:
      DB_PATH: /data/news.db
      CRAWL_LOCK_PATH: /run/crawler-lock/crawl.lock
      TZ: Asia/Seoul
    volumes:
      - news-data:/data
      - ./.deploy/locks:/run/crawler-lock
    restart: unless-stopped
    logging: *default-logging

  # 호스트 포트를 여는 유일한 서비스(기본 127.0.0.1:80). 설정 폴더와 활성 색 파일을 마운트하므로
  # 설정 변경·색 전환은 컨테이너 재생성 없이 reload로 반영된다(nginx/proxy/conf.d/default.conf 참고).
  # LAN/전체 인터페이스 공개가 필요하면 루트 .env나 환경 변수로 WEB_BIND_ADDRESS를 명시한다.
  proxy:
    image: nginx:alpine
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-80}:80"
    volumes:
      - ./nginx/proxy/conf.d:/etc/nginx/conf.d:ro
      - ./.deploy/proxy:/etc/nginx/bluegreen:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

volumes:
  news-data:

networks:
  # 색상별 앱 스택이 external로 참여하는 공유 네트워크. proxy는 web-<색>, backend-<색> alias로 찾는다.
  edge:
    name: news-edge
