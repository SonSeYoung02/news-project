# 라즈베리파이(ARM64) 등에서 `docker compose up -d --build`로 실행한다.
# 상시 서비스는 nginx·backend·crawler이며 외부에는 nginx 포트 하나만 노출한다.
# frontend는 화면 빌드 전용 이미지로, nginx 빌드에만 쓰이고 컨테이너로 실행하지 않는다.

name: news-project

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  crawler:
    build: ./news-crawling
    image: news-crawler:latest
    env_file:
      - path: ./news-crawling/.env
        required: false
    environment:
      DB_PATH: /data/news.db
      TZ: Asia/Seoul
    volumes:
      - news-data:/data
    restart: unless-stopped
    logging: *default-logging

  backend:
    build: ./news-viewer/backend
    image: news-backend:latest
    environment:
      DB_PATH: /data/news.db
      TZ: Asia/Seoul
    volumes:
      - news-data:/data
    depends_on:
      crawler:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # 화면 빌드 전용. scale: 0이라 컨테이너를 만들지 않고, nginx 빌드가
  # additional_contexts(service:frontend)로 이 이미지를 참조할 때 먼저 빌드된다.
  frontend:
    build: ./news-viewer/frontend
    image: news-frontend:latest
    scale: 0

  nginx:
    build:
      context: ./nginx
      additional_contexts:
        frontend-dist: service:frontend
    image: news-nginx:latest
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

volumes:
  news-data:
