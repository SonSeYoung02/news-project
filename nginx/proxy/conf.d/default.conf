# 엣지 프록시(상시 1개). 외부 포트는 이 컨테이너만 노출하고, 활성 색의 앱 스택으로 전달한다.
# 이 폴더는 proxy 컨테이너에 읽기 전용으로 마운트되므로 수정 후 컨테이너 재생성 없이
# scripts/deploy.sh가 `nginx -t` → `nginx -s reload`로 반영한다.
#
# 활성 색은 scripts/deploy.sh가 쓰는 .deploy/proxy/active.conf(→ /etc/nginx/bluegreen/)가 유일한 원천이다.
# 업스트림 이름은 변수로 두고 Docker 내장 DNS로 요청 시점에 해석한다. 그래서 대상 색의 컨테이너가
# 아직 없어도(최초 기동, 재부팅 직후) nginx가 시작되며, 전환 후에는 새 색 이름을 다시 해석한다.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # 기본값(active.conf가 없을 때): blue. active.conf의 set이 이 값을 덮어쓴다.
    set $web_upstream web-blue:80;
    set $backend_upstream backend-blue:8000;
    include /etc/nginx/bluegreen/*.conf;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # App.jsx는 /api 접두사로 호출한다. Vite 개발 프록시와 같게 접두사를 제거해 백엔드로 넘긴다.
    # 쿼리 문자열은 rewrite 후에도 그대로 전달된다.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://$web_upstream;
    }
}

# 컨테이너 헬스체크 전용(컨테이너 내부 루프백). 앱 스택 상태와 무관하게 프록시 자체만 확인한다.
server {
    listen 127.0.0.1:8081;
    access_log off;

    location = /healthz {
        return 200 "ok\n";
    }
}
