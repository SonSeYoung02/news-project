# 프론트 빌드 산출물만 서빙한다. /api/는 엣지 프록시가 backend-<색>으로 직접 보내므로 여기서 다루지 않는다.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 해시가 붙은 빌드 산출물은 오래 캐시한다.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
